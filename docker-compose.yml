services:
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    # Контейнер миграций работает от root и создаёт файл базы с владельцем root,
    # а приложение запускается от nextjs (uid 1001) — без chown любая запись
    # в базу падает с SQLITE_READONLY (чтение при этом работает, поэтому
    # проблема проявляется только при сохранении в админке).
    command: sh -c "npx prisma migrate deploy && chown -R 1001:1001 /app/data"
    volumes:
      - db_data:/app/data

  app:
    build:
      context: .
      target: runner
      # NEXT_PUBLIC_*-переменные вшиваются в бандл при сборке, поэтому их
      # передаём именно как build args (значения берутся из .env рядом с этим файлом)
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}
    restart: unless-stopped
    env_file: .env
    environment:
      # IPv4-адреса api.telegram.org с российского хостинга недоступны, IPv6 —
      # работает. Просим Node пробовать IPv6-адрес первым, иначе каждая отправка
      # уведомления ждёт таймаута на IPv4 (fetch в src/lib/notifications/*).
      NODE_OPTIONS: --dns-result-order=ipv6first
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - db_data:/app/data
      - uploads_data:/app/public/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:

# IPv6 в сети контейнеров нужен для исходящих запросов к API Telegram:
# его IPv4-адреса с этого хостинга не отвечают. Подсеть — приватная (ULA),
# наружу Docker выпускает трафик через NAT, как и для IPv4.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c026::/64
