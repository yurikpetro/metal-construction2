services:
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    volumes:
      - db_data:/app/data

  app:
    build:
      context: .
      target: runner
      # NEXT_PUBLIC_*-переменные вшиваются в бандл при сборке, поэтому их
      # передаём именно как build args (значения берутся из .env рядом с этим файлом)
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - db_data:/app/data
      - uploads_data:/app/public/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
